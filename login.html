<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const temaGuardado = localStorage.getItem('theme');
        if (temaGuardado === 'dark') document.documentElement.setAttribute('theme', 'dark');
    </script>
    <title>Login - SiCECOBAEJ TBC #65</title>
    <link rel="stylesheet" href="./styles/login.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>

    <main>

        <button class="theme-selector" id="cambiador-tema" type="button" aria-label="Cambiar tema">
            <i class="ri-sun-fill"></i>
        </button>

        <div class="row-btn">
            <button class="switch-btn seleccionado" id="docente-mode" type="button">Docente</button>
            <button class="switch-btn" id="alumno-mode" type="button">Alumno</button>
        </div>

        <h1>SiCECOBAEJ TBC #65</h1>
        <h2>Sistema de Control Escolar del COBAEJ TBC #65</h2>
        <img src="./public/COBAEJ-logo-deep.png" alt="COBAEJ Logotipo Oscuro">

        <div class="form-message hidden" id="mensaje-general" role="status" aria-live="polite"></div>

        <div class="" id="login-div">
            <form action="submit" id="form-login">

                <h2>Iniciar Sesión</h2>
                <label for="login-correo">Ingresa tu correo</label>
                <input id="login-correo" name="correo" type="email" placeholder="example@mail.com" autocomplete="email" required>
                <fieldset id="arquetipoLogin-alumno" class="hidden" disabled>
                    <legend class="sr-only">Datos adicionales para alumnos</legend>
                    <label for="login-numero-control">Ingresa tu numero de control</label>
                    <input id="login-numero-control" name="numero_control" type="text" placeholder="Numero-Control-000" autocomplete="username" required>
                </fieldset>
                <label for="login-clave">Ingresa tu contraseña</label>
                <input id="login-clave" name="clave" type="password" placeholder="contraseña-segura-123" autocomplete="current-password" required>

                <button class="form-activation" type="submit" id="login-submit">Ingresar</button>

                <p>¿No tienes cuenta? <a href="#" id="login-ref">Registrate</a></p>

            </form>
        </div>

        <div class="hidden" id="sign-div">
            <form action="submit" id="form-registro">

                <h2>Registrate</h2>
                <label for="registro-nombre">Ingresa tu nombre</label>
                <input id="registro-nombre" name="nombre" type="text" placeholder="Nombre Apellido Apellido" autocomplete="name" required>

                <div class="row-input">
                    <div class="pair">
                        <label for="registro-correo">Ingresa tu correo</label>
                        <input id="registro-correo" name="correo" type="email" placeholder="example@mail.com" autocomplete="email" required>
                    </div>

                    <div class="pair">
                        <fieldset id="arquetipo-docente" class="hidden" disabled>
                            <legend class="sr-only">Datos de registro para docentes</legend>
                            <label for="registro-clave-docente">Ingresa la clave de registro</label>
                            <input id="registro-clave-docente" name="clave_registro" type="text" placeholder="Clave-Registro-XYZ" required>
                        </fieldset>

                        <fieldset id="arquetipo-alumno" class="hidden" disabled>
                            <legend class="sr-only">Datos de registro para alumnos</legend>
                            <label for="registro-numero-control">Ingresa el número de control</label>
                            <input id="registro-numero-control" name="numero_control" type="text" placeholder="Numero-Control-000" autocomplete="username" required>
                        </fieldset>
                    </div>
                </div>

                <div class="row-input">
                    <div class="pair">
                        <label for="registro-clave">Ingresa tu contraseña</label>
                        <input id="registro-clave" name="clave" type="password" placeholder="contraseña-segura-123" autocomplete="new-password" required>
                    </div>

                    <div class="pair">
                        <label for="registro-clave-confirmar">Confirma tu contraseña</label>
                        <input id="registro-clave-confirmar" name="claveConfirmar" type="password" placeholder="misma-contraseña-segura" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="form-activation" id="registro-submit">Registrarse</button>

                <p>¿Ya tienes cuenta? <a href="#" id="sign-ref">Inicia Sesión</a></p>

            </form>
        </div>
    </main>

    <script src="./scripts/login.js"></script>
</body>

</html>
