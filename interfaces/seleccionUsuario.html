<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Selection - COBAEJ</title>
    <link rel="stylesheet" href="../styles/seleccionUsuario.css">
    <link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
</head>

<body>
    <main>
        <img src="../resources/COBAEJ-logo-deep.png" alt="Logotipo minimalista: COBAEJ" class="logo">
        <h1 class="titulo">Seleccione Su Usuario</h1>
        <button class="agregar">
            <i class="ri-user-add-fill"></i>
            Agregar Docente
        </button>
        <button class="perfil1">
            <i class="ri-user-2-fill"></i>
            Joaquin Andrade
        </button>
        <button class="perfil2">
            <i class="ri-user-2-fill"></i>
            Yolanda Sanchez
        </button>

        <!-- Boton de salida -->
        <button class="btnSalir" id="btnSalir">
            <i class="ri-logout-circle-line"></i>
            Salir
        </button>

        <!-- Blur y Toast -->
        <div class="blur hidden" id="blur">
            <div class="toast" id="toast">
                <h1 class="titulo">¿Seguro que quieres salir?</h1>
                <button class="perfil1" id="btnSalirCancelar">Cancelar</button>
                <button class="agregar" id="btnSalirConfirmar">
                    <i class="ri-logout-box-line"></i>
                    Salir
                </button>
            </div>
        </div>
    </main>

    <script src="../scripts/seleccionUsuario.js"></script>
</body>

</html>
