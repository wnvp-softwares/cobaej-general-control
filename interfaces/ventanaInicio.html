<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StartUp View - COBAEJ</title>
    <link rel="stylesheet" href="../styles/ventanaInicio.css">
    <link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
</head>

<body>
    <main>
        <h1 class="titulo">COBAEJ - Control Escolar</h1>
        <img src="../resources/COBAEJ-logo-deep.png" alt="Logotipo minimalista: COBAEJ" class="logo">
        <button class="btnIngresar" id="btnIngresar">
            <i class="ri-logout-box-r-line"></i>
            Ingresar
        </button>
        <button class="btnSalir" id="btnSalir">
            <i class="ri-logout-box-line"></i>
            Salir
        </button>

        <div class="blur hidden" id="blur">
            <div class="toast" id="toast">
                <h1 class="titulo">¿Seguro que quieres salir?</h1>
                <button class="btnSalir" id="btnSalirCancelar">Cancelar</button>
                <button class="btnIngresar" id="btnSalirConfirmar">
                    <i class="ri-logout-box-line"></i>
                    Salir
                </button>
            </div>
        </div>
    </main>

    <script src="../scripts/ventanaInicio.js"></script>
</body>

</html>
